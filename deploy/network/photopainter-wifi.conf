# The frame's Wi-Fi: power saving off. scripts/deploy.sh installs this as
# /etc/NetworkManager/conf.d/90-photopainter-wifi.conf.
#
# The Pi's Wi-Fi chip saves power by sleeping between the router's beacons, which is a known cause
# of a Raspberry Pi dropping off Wi-Fi or staying on it while nothing gets through. The frame is
# plugged in, so it gains nothing from it. On the battery the frame draws a little more for it; low
# power turns Wi-Fi off altogether. Applies to each network as it's joined.
[connection]
wifi.powersave = 2
