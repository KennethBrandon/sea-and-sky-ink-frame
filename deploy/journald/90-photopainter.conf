# Keep the system log across restarts. scripts/deploy.sh installs this as
# /etc/systemd/journald.conf.d/90-photopainter.conf.
#
# Raspberry Pi OS keeps the journal in memory only (40-rpi-volatile-storage.conf), so a restart
# erases why the frame needed one: on 2026-11-15 the restart that ended a 3½-day outage took its
# logs with it. This sorts after that file and wins. Capped well below the SD card's free space;
# the tick logs only what changes, so this holds weeks.
[Journal]
Storage=persistent
SystemMaxUse=100M
